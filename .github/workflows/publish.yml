name: Publish

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub environment for the publish step. Protection rules (required
    # reviewers / wait timer / tag restrictions) require a public repo or a paid
    # plan; on a private + Free repo this runs unprotected but is ready to gate
    # the moment that changes. Also the optional match condition for the npm
    # trusted publisher (scope it to environment "npm" on npmjs.com to enforce).
    environment:
      name: npm
      url: https://www.npmjs.com/package/@crawlbrulee/sdk
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC trusted publishing + provenance attestations
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so we can check the tag's commit is on main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Deliberately NO registry-url: it makes setup-node write an .npmrc
          # and set NODE_AUTH_TOKEN to a dummy placeholder, which npm then sends
          # as a (bogus) auth token instead of performing the OIDC trusted-
          # publishing exchange. Without it, npm >= 11.5 + id-token: write does
          # OIDC automatically against the default registry.npmjs.org.

      - name: Verify tagged commit is on main
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE '(^|[[:space:]])origin/main$'; then
            echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on origin/main. Refusing to publish."
            exit 1
          fi

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION."
            exit 1
          fi

      - name: Upgrade npm (OIDC trusted publishing needs npm >= 11.5)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        # No NODE_AUTH_TOKEN: npm >= 11.5 performs OIDC token exchange via the
        # trusted publisher configured for this repo on npmjs.com. prepublishOnly
        # (pnpm verify) runs the full check + builds dist before packing.
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
